[project]
name = "harnessbench"
version = "0.1.0"
description = "A public benchmark that grades whether an agent harness's stated safety rules are mechanically enforced or merely advised."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Saagar Patel" }]
dependencies = []

# Optional: emit results as Verified-Check Records via the shared vcr-core spine (pure-stdlib
# for build/score). HarnessBench's core stays zero-third-party-dependency; this extra only
# enables `harnessbench.vcr_emit`. See docs/integration-vcr.md.
[project.optional-dependencies]
vcr = ["vcr-core>=0.1.0"]

[dependency-groups]
dev = ["ruff>=0.6"]

# HarnessBench runs on the standard library alone. uv manages the dev toolchain
# only; nothing here is built or published as a wheel in v1, so uv treats the
# tree as a workspace rather than an installable package.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
